<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الاختبارات التفاعلية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cairo Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8fafc;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col antialiased bg-slate-50">

    <div id="app" class="flex-grow flex flex-col min-h-screen">
        <!-- Top Navigation Header (Shown when logged in) -->
        <header id="app-header" class="hidden bg-indigo-700 text-white shadow-md sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <!-- Hamburger Menu Button (Top Right in RTL) -->
                <div class="flex items-center gap-3">
                    <button id="btn-menu" onclick="toggleSidebar()" class="p-2 hover:bg-indigo-600 rounded-lg transition-colors focus:outline-none" title="القوائم">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                    <span id="user-badge" class="bg-indigo-800 text-indigo-100 text-xs px-3 py-1 rounded-full font-bold">
                        مستخدم #<span id="header-user-id"></span>
                    </span>
                </div>
                
                <h1 class="text-lg font-bold tracking-wide hidden sm:block">منصة الاختبارات والقدرات</h1>

                <!-- Logout Button (Top Left in RTL) -->
                <button onclick="logout()" class="flex items-center gap-2 bg-rose-600 hover:bg-rose-700 text-white text-sm px-3 py-1.5 rounded-lg font-semibold transition-all shadow-sm">
                    <span>تسجيل الخروج</span>
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>

        <!-- Navigation Drawer Overlay & Sidebar -->
        <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden transition-opacity"></div>
        <aside id="sidebar" class="fixed top-0 right-0 h-full w-72 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
            <div class="p-4 bg-indigo-700 text-white flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-graduation-cap text-2xl text-amber-300"></i>
                    <span class="font-bold text-lg">قائمة المنصة</span>
                </div>
                <button onclick="toggleSidebar()" class="text-indigo-200 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <nav id="sidebar-nav" class="p-4 flex-1 overflow-y-auto space-y-2">
                <!-- Links injected dynamically based on User vs Admin -->
            </nav>

            <div class="p-4 border-t border-slate-100 bg-slate-50 text-xs text-slate-500 text-center">
                منصة الاختبارات والقدرات الذكية &copy; 2026
            </div>
        </aside>

        <main id="main-content" class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">
            <!-- Dynamic pages will be rendered here -->
        </main>
    </div>

    <!-- Passage Reading Modal (فهم المقروء) -->
    <div id="passage-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl flex flex-col max-h-[85vh] animate-scale-up">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="font-bold text-lg text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-book-open text-indigo-600"></i>
                    النص القرائي
                </h3>
                <button onclick="closePassageModal()" class="text-slate-400 hover:text-rose-600 p-2 rounded-lg hover:bg-slate-100">
                    <i class="fa-solid fa-xmark text-2xl"></i>
                </button>
            </div>
            <div id="passage-modal-content" class="overflow-y-auto custom-scrollbar p-3 bg-slate-50 rounded-xl text-slate-700 leading-relaxed text-base whitespace-pre-line border border-slate-200">
            </div>
            <div class="mt-4 pt-3 border-t text-left">
                <button onclick="closePassageModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2 rounded-xl transition-colors">
                    إغلاق النص
                </button>
            </div>
        </div>
    </div>

    <!-- Global Dynamic Modal/Notification Alert Container -->
    <div id="toast-container" class="fixed bottom-5 left-5 z-50 flex flex-col gap-2"></div>

    <script>
        // Initial Default Categories Data (فارغة لغرض الربط مع قاعدة البيانات)
        const DEFAULT_CATEGORIES = [];

        // Global State Manager
        let currentUser = null; // Stores user object or null
        let appCategories = [];
        let userStats = {
            testedCategories: 0,
            totalScores: 0,
            totalTestsCount: 0,
            totalTimeSeconds: 0,
            wrongQuestions: [], // List of question objects with category info
            savedQuestions: [], // List of question objects with category info
            testHistory: []     // List of finished test objects
        };

        // Active Quiz Session State
        let currentQuiz = null;

        function initApp() {
            // Load Categories
            const savedCats = localStorage.getItem('quiz_app_categories');
            if (savedCats) {
                appCategories = JSON.parse(savedCats);
            } else {
                appCategories = DEFAULT_CATEGORIES;
                saveCategoriesToStorage();
            }

            // Check if user session active
            const activeUser = localStorage.getItem('quiz_app_active_user');
            if (activeUser) {
                loginUser(activeUser, false);
            } else {
                renderLoginView();
            }
        }

        function saveCategoriesToStorage() {
            localStorage.setItem('quiz_app_categories', JSON.stringify(appCategories));
        }

        function saveUserData() {
            if (!currentUser || currentUser === '330') return;
            localStorage.setItem(`quiz_user_data_${currentUser}`, JSON.stringify(userStats));
        }

        function loadUserData(userId) {
            const data = localStorage.getItem(`quiz_user_data_${userId}`);
            if (data) {
                userStats = JSON.parse(data);
                // Fallbacks for array safety
                userStats.wrongQuestions = userStats.wrongQuestions || [];
                userStats.savedQuestions = userStats.savedQuestions || [];
                userStats.testHistory = userStats.testHistory || [];
            } else {
                userStats = {
                    testedCategories: 0,
                    totalScores: 0,
                    totalTestsCount: 0,
                    totalTimeSeconds: 0,
                    wrongQuestions: [],
                    savedQuestions: [],
                    testHistory: []
                };
            }
        }

        function loginUser(userId, isNewLogin = true) {
            userId = userId.trim();
            if (!userId) {
                showToast('الرجاء إدخال رقم المستخدم', 'error');
                return;
            }

            currentUser = userId;
            localStorage.setItem('quiz_app_active_user', currentUser);

            // Setup Header UI
            document.getElementById('app-header').classList.remove('hidden');
            document.getElementById('header-user-id').textContent = currentUser;

            if (currentUser === '330') {
                // Admin Flow
                renderSidebarAdmin();
                renderAdminDashboard();
                if (isNewLogin) showToast('مرحباً بك في لوحة المشرف Admin', 'success');
            } else {
                // Regular User Flow
                loadUserData(currentUser);
                renderSidebarUser();
                renderUserDashboard();
                if (isNewLogin) showToast(`مرحباً بك مستخدم رقم #${currentUser}`, 'success');
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('quiz_app_active_user');
            document.getElementById('app-header').classList.add('hidden');
            closeSidebar();
            renderLoginView();
            showToast('تم تسجيل الخروج بنجاح', 'info');
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const isHidden = sidebar.classList.contains('translate-x-full');
            if (isHidden) {
                sidebar.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.add('translate-x-full');
            document.getElementById('sidebar-overlay').classList.add('hidden');
        }

        function renderSidebarUser() {
            const nav = document.getElementById('sidebar-nav');
            nav.innerHTML = `
                <button onclick="closeSidebar(); renderUserDashboard()" class="w-full text-right px-4 py-3 rounded-xl hover:bg-indigo-50 hover:text-indigo-700 font-semibold flex items-center gap-3 transition-colors">
                    <i class="fa-solid fa-chart-line text-indigo-600"></i>
                    <span>الرئيسية والإحصائيات</span>
                </button>
                <button onclick="closeSidebar(); renderUserCategoriesView()" class="w-full text-right px-4 py-3 rounded-xl hover:bg-indigo-50 hover:text-indigo-700 font-semibold flex items-center gap-3 transition-colors">
                    <i class="fa-solid fa-list-check text-indigo-600"></i>
                    <span>الأقسام والاختبارات</span>
                </button>
                <button onclick="closeSidebar(); renderWrongQuestionsView()" class="w-full text-right px-4 py-3 rounded-xl hover:bg-indigo-50 hover:text-indigo-700 font-semibold flex items-center gap-3 transition-colors">
                    <i class="fa-solid fa-circle-xmark text-rose-500"></i>
                    <span>الأسئلة الخاطئة</span>
                    ${userStats.wrongQuestions.length ? `<span class="mr-auto bg-rose-100 text-rose-700 text-xs px-2 py-0.5 rounded-full">${userStats.wrongQuestions.length}</span>` : ''}
                </button>
                <button onclick="closeSidebar(); renderSavedQuestionsView()" class="w-full text-right px-4 py-3 rounded-xl hover:bg-indigo-50 hover:text-indigo-700 font-semibold flex items-center gap-3 transition-colors">
                    <i class="fa-solid fa-bookmark text-amber-500"></i>
                    <span>الأسئلة المحفوظة</span>
                    ${userStats.savedQuestions.length ? `<span class="mr-auto bg-amber-100 text-amber-800 text-xs px-2 py-0.5 rounded-full">${userStats.savedQuestions.length}</span>` : ''}
                </button>
                <button onclick="closeSidebar(); renderTestHistoryView()" class="w-full text-right px-4 py-3 rounded-xl hover:bg-indigo-50 hover:text-indigo-700 font-semibold flex items-center gap-3 transition-colors">
                    <i class="fa-solid fa-clock-rotate-left text-teal-600"></i>
                    <span>سجل اختبارات الأقسام</span>
                </button>
            `;
        }

        function renderSidebarAdmin() {
            const nav = document.getElementById('sidebar-nav');
            nav.innerHTML = `
                <button onclick="closeSidebar(); renderAdminDashboard()" class="w-full text-right px-4 py-3 rounded-xl hover:bg-indigo-50 hover:text-indigo-700 font-semibold flex items-center gap-3 transition-colors">
                    <i class="fa-solid fa-gauge-high text-indigo-600"></i>
                    <span>لوحة إحصائيات المشرف</span>
                </button>
                <button onclick="closeSidebar(); renderAdminManageCategories()" class="w-full text-right px-4 py-3 rounded-xl hover:bg-indigo-50 hover:text-indigo-700 font-semibold flex items-center gap-3 transition-colors">
                    <i class="fa-solid fa-folder-gear text-indigo-600"></i>
                    <span>إدارة الأقسام والأسئلة</span>
                </button>
            `;
        }

        function renderLoginView() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="min-h-[80vh] flex items-center justify-center">
                    <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-8 max-w-md w-full text-center relative overflow-hidden">
                        <div class="absolute -top-12 -left-12 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl"></div>
                        <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-5 text-3xl shadow-inner">
                            <i class="fa-solid fa-user-graduate"></i>
                        </div>
                        <h2 class="text-2xl font-extrabold text-slate-800 mb-2">منصة الاختبارات التفاعلية</h2>
                        <p class="text-slate-500 text-sm mb-6">قم بترك رقم المستخدم للدخول، أو سجّل الرقم 330 للدخول كمشرف النظام</p>

                        <form onsubmit="event.preventDefault(); handleLoginSubmit();" class="space-y-4 text-right">
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1">رقم المستخدم</label>
                                <div class="relative">
                                    <input type="number" id="login-user-id" placeholder="أدخل رقمك الخاص (مثال: 101)" 
                                           class="w-full px-4 py-3.5 pr-11 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-lg font-bold tracking-wider transition-all" required />
                                    <i class="fa-solid fa-id-card absolute top-4 right-4 text-slate-400"></i>
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-200 hover:shadow-indigo-300 transition-all flex items-center justify-center gap-2">
                                <span>تسجيل الدخول / البدء</span>
                                <i class="fa-solid fa-arrow-left"></i>
                            </button>
                        </form>
                        
                        <div class="mt-6 pt-4 border-t text-xs text-slate-400">
                            ملاحظة: إذا لم يكن الرقم مسجلاً من قبل، سيتم إنشاؤه تلقائياً.
                        </div>
                    </div>
                </div>
            `;
        }

        function handleLoginSubmit() {
            const val = document.getElementById('login-user-id').value;
            if (val) loginUser(val, true);
        }

        function renderUserDashboard() {
            const avgScore = userStats.totalTestsCount > 0 
                ? (userStats.totalScores / userStats.totalTestsCount).toFixed(1) 
                : 0;
            
            const totalMinutes = Math.floor(userStats.totalTimeSeconds / 60);
            const avgTimeSec = userStats.totalTestsCount > 0 
                ? Math.round(userStats.totalTimeSeconds / userStats.totalTestsCount) 
                : 0;

            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="space-y-6">
                    <!-- Welcome Hero Banner -->
                    <div class="bg-gradient-to-r from-indigo-700 via-indigo-600 to-purple-700 rounded-3xl p-6 md:p-8 text-white shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-6 relative overflow-hidden">
                        <div class="z-10">
                            <span class="bg-white/20 backdrop-blur-md text-indigo-100 text-xs px-3 py-1 rounded-full font-bold">لوحة التحليلات الشخصية</span>
                            <h2 class="text-2xl md:text-3xl font-black mt-2">أهلاً بك، مستخدم #${currentUser}!</h2>
                            <p class="text-indigo-100 text-sm mt-1 max-w-xl">تابع تقدمك وإحصائيات جميع الاختبارات والأقسام التي انجزتها وراجع نقاط ضعفها لتطوير مستواك.</p>
                        </div>
                        <button onclick="renderUserCategoriesView()" class="z-10 bg-amber-400 hover:bg-amber-300 text-slate-900 font-bold px-6 py-3 rounded-2xl shadow-lg transition-transform hover:scale-105 flex items-center gap-2 whitespace-nowrap">
                            <i class="fa-solid fa-play"></i>
                            <span>بدء اختبار جديد</span>
                        </button>
                    </div>

                    <!-- Statistics Grid -->
                    <h3 class="font-bold text-xl text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-chart-pie text-indigo-600"></i>
                        ملخص الإحصائيات العامة
                    </h3>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                        <!-- Stat Card 1 -->
                        <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm flex items-center gap-4">
                            <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center text-2xl font-bold">
                                <i class="fa-solid fa-layer-group"></i>
                            </div>
                            <div>
                                <div class="text-slate-400 text-xs font-bold mb-1">الأقسام المختبرة</div>
                                <div class="text-2xl font-extrabold text-slate-800">${userStats.testedCategories} قسم</div>
                            </div>
                        </div>

                        <!-- Stat Card 2 -->
                        <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm flex items-center gap-4">
                            <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-2xl font-bold">
                                <i class="fa-solid fa-star"></i>
                            </div>
                            <div>
                                <div class="text-slate-400 text-xs font-bold mb-1">مجموع الدرجات / المتوسط</div>
                                <div class="text-xl font-extrabold text-slate-800">${userStats.totalScores} ن <span class="text-xs text-emerald-600 font-normal">(${avgScore}%)</span></div>
                            </div>
                        </div>

                        <!-- Stat Card 3 -->
                        <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm flex items-center gap-4">
                            <div class="w-14 h-14 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center text-2xl font-bold">
                                <i class="fa-solid fa-stopwatch"></i>
                            </div>
                            <div>
                                <div class="text-slate-400 text-xs font-bold mb-1">إجمالي الوقت المستغرق</div>
                                <div class="text-xl font-extrabold text-slate-800">${totalMinutes} دقيقة</div>
                            </div>
                        </div>

                        <!-- Stat Card 4 -->
                        <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm flex items-center gap-4">
                            <div class="w-14 h-14 bg-sky-50 text-sky-600 rounded-2xl flex items-center justify-center text-2xl font-bold">
                                <i class="fa-solid fa-bolt"></i>
                            </div>
                            <div>
                                <div class="text-slate-400 text-xs font-bold mb-1">متوسط وقت الاختبار</div>
                                <div class="text-xl font-extrabold text-slate-800">${avgTimeSec} ثانية</div>
                            </div>
                        </div>
                    </div>

                    <!-- Quick Shortcuts -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 pt-4">
                        <div onclick="renderWrongQuestionsView()" class="cursor-pointer bg-gradient-to-br from-rose-500 to-rose-600 text-white p-6 rounded-2xl shadow-md hover:shadow-lg transition-all flex justify-between items-center">
                            <div>
                                <h4 class="font-extrabold text-lg">الأسئلة الخاطئة</h4>
                                <p class="text-rose-100 text-xs mt-1">مراجعة وتعديل المفاهيم (${userStats.wrongQuestions.length} سؤال)</p>
                            </div>
                            <i class="fa-solid fa-circle-xmark text-3xl opacity-80"></i>
                        </div>

                        <div onclick="renderSavedQuestionsView()" class="cursor-pointer bg-gradient-to-br from-amber-500 to-amber-600 text-white p-6 rounded-2xl shadow-md hover:shadow-lg transition-all flex justify-between items-center">
                            <div>
                                <h4 class="font-extrabold text-lg">الأسئلة المحفوظة</h4>
                                <p class="text-amber-100 text-xs mt-1">الأسئلة الهامة للمراجعة (${userStats.savedQuestions.length} سؤال)</p>
                            </div>
                            <i class="fa-solid fa-bookmark text-3xl opacity-80"></i>
                        </div>

                        <div onclick="renderTestHistoryView()" class="cursor-pointer bg-gradient-to-br from-teal-500 to-teal-600 text-white p-6 rounded-2xl shadow-md hover:shadow-lg transition-all flex justify-between items-center">
                            <div>
                                <h4 class="font-extrabold text-lg">سجل الاختبارات</h4>
                                <p class="text-teal-100 text-xs mt-1">تفاصيل المحاولات والوقت (${userStats.testHistory.length} اختبار)</p>
                            </div>
                            <i class="fa-solid fa-clock-rotate-left text-3xl opacity-80"></i>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderUserCategoriesView() {
            const main = document.getElementById('main-content');
            
            let categoriesHtml = appCategories.map(cat => `
                <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm hover:shadow-md transition-all flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <span class="bg-indigo-50 text-indigo-700 font-bold text-xs px-3 py-1 rounded-full mb-2 inline-block">
                            عدد الأسئلة: ${cat.questions.length} أسئلة
                        </span>
                        <h4 class="text-lg font-extrabold text-slate-800">${escapeHtml(cat.title)}</h4>
                    </div>
                    <button onclick="startCategoryQuiz('${cat.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-xl shadow transition-colors flex items-center gap-2 whitespace-nowrap">
                        <span>اختبر هذا القسم</span>
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                </div>
            `).join('');

            if (appCategories.length === 0) {
                categoriesHtml = `<div class="p-8 text-center text-slate-400 bg-white rounded-2xl">لا توجد أقسام مضافة حالياً من قبل المشرف.</div>`;
            }

            main.innerHTML = `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <h2 class="text-2xl font-black text-slate-800">أقسام الاختبارات المتاحة</h2>
                            <p class="text-slate-500 text-sm mt-1">اختر قسماً محدداً لاختباره أو قم باختبار جميع الأقسام معاً</p>
                        </div>
                        ${appCategories.length > 0 ? `
                        <button onclick="startAllCategoriesQuiz()" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-extrabold px-6 py-3 rounded-2xl shadow-md transition-all flex items-center gap-2">
                            <i class="fa-solid fa-layer-group text-lg"></i>
                            <span>اختبر جميع الأقسام</span>
                        </button>
                        ` : ''}
                    </div>

                    <div class="space-y-4">
                        ${categoriesHtml}
                    </div>
                </div>
            `;
        }

        function startCategoryQuiz(categoryId) {
            const cat = appCategories.find(c => c.id === categoryId);
            if (!cat || !cat.questions.length) {
                showToast('هذا القسم لا يحتوي على أسئلة متاحة حالياً', 'warning');
                return;
            }
            initQuizEngine([cat], `اختبار: ${cat.title}`);
        }

        function startAllCategoriesQuiz() {
            if (!appCategories.length) return;
            initQuizEngine(appCategories, 'اختبار جميع الأقسام المتاحة');
        }

        function initQuizEngine(categoriesList, title) {
            // Aggregate all questions with their category context
            let questionsList = [];
            categoriesList.forEach(cat => {
                cat.questions.forEach(q => {
                    questionsList.push({
                        ...q,
                        categoryTitle: cat.title,
                        categoryId: cat.id
                    });
                });
            });

            currentQuiz = {
                title: title,
                questions: questionsList,
                currentIndex: 0,
                userAnswers: {},  // qIndex -> chosenOptionIndex
                flaggedForReview: {}, // qIndex -> boolean
                timeStarted: new Date(),
                questionStartTimes: {}, // qIndex -> Date
                questionDurations: {} // qIndex -> seconds
            };

            currentQuiz.questionStartTimes[0] = new Date();
            renderQuizQuestionView();
        }

        function renderQuizQuestionView() {
            const q = currentQuiz.questions[currentQuiz.currentIndex];
            const qIndex = currentQuiz.currentIndex;
            const totalQ = currentQuiz.questions.length;

            const isSaved = isQuestionSaved(q);
            const isFlagged = !!currentQuiz.flaggedForReview[qIndex];

            // Formulate Question Prompt & Sub-Header according to Type rules
            let questionHeader = '';
            let promptText = q.prompt || '';
            let questionBody = '';

            if (q.type === 'الخطأ السياقي') {
                questionHeader = `<div class="bg-rose-50 text-rose-700 text-sm font-bold px-4 py-2 rounded-xl mb-3 inline-block">استخرج الخطأ السياقي</div>`;
                questionBody = `<div class="text-xl font-bold text-slate-800 leading-relaxed mb-6 bg-slate-50 p-4 rounded-2xl border border-slate-200">${escapeHtml(q.sentence || '')}</div>`;
            } else if (q.type === 'التناظر اللفظي') {
                questionHeader = `<div class="bg-amber-50 text-amber-800 text-sm font-bold px-4 py-2 rounded-xl mb-3 inline-block">استخرج التناظر</div>`;
                questionBody = `
                    <div class="text-2xl font-black text-indigo-700 tracking-wider text-center py-5 bg-indigo-50/50 border border-indigo-100 rounded-2xl mb-6">
                        ${escapeHtml(q.word1)} : ${escapeHtml(q.word2)}

            } else if (q.type === 'فهم المقروء') {
                questionHeader = `

                        <button onclick="openPassageModal(\`${escapeJsString(q.passage || '')}\`)" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2 rounded-xl shadow transition-colors flex items-center gap-2">
                            <i class="fa-solid fa-book-open"></i>
                            <span>إظهار النص</span>
                        </button>
                    </div>
                `;
                questionBody = `<div class="text-lg font-bold text-slate-800 mb-6 bg-slate-50 p-4 rounded-2xl border border-slate-200">${escapeHtml(q.question || '')}</div>`;
            } else if (q.type === 'المفردة الشاذة') {
                questionHeader = `<div class="bg-purple-50 text-purple-700 text-sm font-bold px-4 py-2 rounded-xl mb-3 inline-block">استخرج المفردة الشاذة</div>`;

                questionHeader = `<div class="bg-sky-50 text-sky-700 text-sm font-bold px-4 py-2 rounded-xl mb-3 inline-block">اكمل الجملة الآتية:</div>`;

                if (q.type === 'التناظر اللفظي' && opt.word1 && opt.word2) {

                            ? 'border-indigo-600 bg-indigo-50/70 text-indigo-900 shadow-sm' 
                            : 'border-slate-200 bg-white hover:border-slate-300 text-slate-700'

                        ${questionHeader}
                        ${questionBody}

                        <!-- Action Controls: Save (Bookmark) & Add to Review -->
                        <div class="flex items-center justify-between border-y border-slate-100 py-3 my-2">
                            <button onclick="toggleBookmarkCurrentQuestion()" class="flex items-center gap-2 text-sm font-bold ${isSaved ? 'text-amber-500' : 'text-slate-400 hover:text-amber-500'} transition-colors">
                                <i class="${isSaved ? 'fa-solid' : 'fa-regular'} fa-bookmark text-lg"></i>
                                <span>${isSaved ? 'تم حفظ السؤال' : 'حفظ السؤال'}</span>
                            </button>

                            <button onclick="toggleFlagReviewCurrentQuestion()" class="flex items-center gap-2 text-sm font-bold ${isFlagged ? 'text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-xl' : 'text-slate-400 hover:text-indigo-600'} transition-colors">

                                <span>${isFlagged ? 'محدد للمراجعة' : 'إضافة للأسئلة المراجعة'}</span>

                        <div class="space-y-3 pt-2">
                            ${optionsHtml}
                        </div>
                    </div>

                    <!-- Navigation Footer Buttons -->
                    <div class="flex items-center justify-between gap-4">
                        <button onclick="prevQuizQuestion()" ${qIndex === 0 ? 'disabled class="opacity-40 cursor-not-allowed bg-slate-200 text-slate-500 font-bold px-5 py-3 rounded-xl"' : 'class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-6 py-3 rounded-xl transition-colors"'}>
                            السابق
                        </button>

                        ${qIndex < totalQ - 1 ? `
                            <button onclick="nextQuizQuestion()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-8 py-3 rounded-xl shadow transition-colors flex items-center gap-2">
                                <span>التالي</span>
                                <i class="fa-solid fa-arrow-left"></i>
                            </button>
                        ` : `
                            <button onclick="finishQuizReviewCheck()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold px-8 py-3 rounded-xl shadow-lg transition-colors flex items-center gap-2">
                                <i class="fa-solid fa-circle-check"></i>
                                <span>إنهاء وتأكيد الاختبار</span>
                            </button>
                        `}
                    </div>
                </div>
            `;
        }

        function recordQuestionDuration() {
            const qIndex = currentQuiz.currentIndex;
            if (currentQuiz.questionStartTimes[qIndex]) {
                const now = new Date();
                const diffSec = Math.round((now - currentQuiz.questionStartTimes[qIndex]) / 1000);
                currentQuiz.questionDurations[qIndex] = (currentQuiz.questionDurations[qIndex] || 0) + diffSec;
            }
        }

        function selectQuizAnswer(optIndex) {
            currentQuiz.userAnswers[currentQuiz.currentIndex] = optIndex;
            renderQuizQuestionView();
        }

        function nextQuizQuestion() {
            recordQuestionDuration();
            if (currentQuiz.currentIndex < currentQuiz.questions.length - 1) {
                currentQuiz.currentIndex++;
                currentQuiz.questionStartTimes[currentQuiz.currentIndex] = new Date();
                renderQuizQuestionView();
            }
        }

        function prevQuizQuestion() {
            recordQuestionDuration();
            if (currentQuiz.currentIndex > 0) {
                currentQuiz.currentIndex--;
                currentQuiz.questionStartTimes[currentQuiz.currentIndex] = new Date();
                renderQuizQuestionView();
            }
        }

        function toggleBookmarkCurrentQuestion() {
            const q = currentQuiz.questions[currentQuiz.currentIndex];
            const isSaved = isQuestionSaved(q);
            if (isSaved) {
                userStats.savedQuestions = userStats.savedQuestions.filter(sq => sq.id !== q.id);
                showToast('تم إزالة السؤال من المحفوظات', 'info');
            } else {
                userStats.savedQuestions.push({
                    ...q,
                    savedAt: new Date().toISOString()
                });
                showToast('تم حفظ السؤال في القائمة المحفوظة', 'success');
            }
            saveUserData();
            renderQuizQuestionView();
        }

        function toggleFlagReviewCurrentQuestion() {
            const idx = currentQuiz.currentIndex;
            if (currentQuiz.flaggedForReview[idx]) {
                delete currentQuiz.flaggedForReview[idx];
                showToast('تم إزالة علامة المراجعة', 'info');
            } else {
                currentQuiz.flaggedForReview[idx] = true;
                showToast('تم تحديد السؤال للمراجعة قبل الإرسال', 'success');
            }
            renderQuizQuestionView();
        }

        function isQuestionSaved(question) {
            return userStats.savedQuestions.some(sq => sq.id === question.id);
        }

        function finishQuizReviewCheck() {
            recordQuestionDuration();

            // Check if there are questions flagged for review
            const flaggedIndices = Object.keys(currentQuiz.flaggedForReview).map(Number);

            if (flaggedIndices.length > 0) {
                let flaggedListHtml = flaggedIndices.map(idx => `
                    <div onclick="jumpToQuizQuestion(${idx})" class="p-3 bg-amber-50 hover:bg-amber-100 border border-amber-200 rounded-xl cursor-pointer flex justify-between items-center transition-colors">
                        <span class="font-bold text-amber-900">سؤال ${idx + 1}: ${escapeHtml(currentQuiz.questions[idx].type)}</span>
                        <span class="text-xs text-amber-700 font-semibold bg-amber-200 px-2.5 py-1 rounded-lg">الذهاب للسؤال</span>
                    </div>
                `).join('');

                const main = document.getElementById('main-content');
                main.innerHTML = `
                    <div class="max-w-2xl mx-auto bg-white rounded-3xl p-6 md:p-8 border border-slate-100 shadow-xl space-y-6">
                        <div class="text-center">
                            <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-3">
                                <i class="fa-solid fa-rotate-right"></i>
                            </div>
                            <h3 class="text-2xl font-black text-slate-800">مراجعة الأسئلة قبل الإرسال</h3>
                            <p class="text-slate-500 text-sm mt-1">لقد قمت بوضع علامة مراجعة على الأسئلة التالية:</p>
                        </div>

                        <div class="space-y-2 max-h-60 overflow-y-auto custom-scrollbar p-1">
                            ${flaggedListHtml}
                        </div>

                        <div class="flex flex-col sm:flex-row items-center gap-3 pt-4 border-t">
                            <button onclick="calculateAndSubmitQuizResults()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3.5 rounded-xl shadow-md transition-colors">
                                إرسال واعتماد النتائج فوراً
                            </button>
                            <button onclick="jumpToQuizQuestion(${flaggedIndices[0]})" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3.5 rounded-xl transition-colors">
                                العودة لمراجعة الأسئلة
                            </button>
                        </div>
                    </div>
                `;
            } else {
                calculateAndSubmitQuizResults();
            }
        }

        function jumpToQuizQuestion(index) {
            currentQuiz.currentIndex = index;
            currentQuiz.questionStartTimes[index] = new Date();
            renderQuizQuestionView();
        }

        function calculateAndSubmitQuizResults() {
            const timeEnded = new Date();
            const totalDurationSec = Math.round((timeEnded - currentQuiz.timeStarted) / 1000);

            let totalAchievedWeight = 0;
            let totalMaxWeight = currentQuiz.questions.length; // Each question base max weight is 1
            let wrongQuestionsInThisTest = [];
            let questionLogs = [];

            currentQuiz.questions.forEach((q, idx) => {
                const chosenOptIdx = currentQuiz.userAnswers[idx];
                const duration = currentQuiz.questionDurations[idx] || 0;
                let isOptCorrect = false;
                let optWeight = 0;

                if (chosenOptIdx !== undefined && q.options[chosenOptIdx]) {
                    optWeight = q.options[chosenOptIdx].weight !== undefined ? q.options[chosenOptIdx].weight : 0;
                }

                totalAchievedWeight += optWeight;

                // Standard definition: If answer has max weight (1) then it's optimal correct, otherwise considered wrong/suboptimal
                if (optWeight === 1) {
                    isOptCorrect = true;
                } else {
                    // Add to wrong questions
                    wrongQuestionsInThisTest.push(q);
                    
                    // Add to user persistent wrong questions list if not existing
                    if (!userStats.wrongQuestions.some(wq => wq.id === q.id)) {
                        userStats.wrongQuestions.push({
                            ...q,
                            wrongAt: new Date().toISOString()
                        });
                    }
                }

                questionLogs.push({
                    questionId: q.id,
                    type: q.type,
                    categoryTitle: q.categoryTitle,
                    chosenOptionIndex: chosenOptIdx,
                    isCorrect: isOptCorrect,
                    weightAchieved: optWeight,
                    timeSpentSeconds: duration,
                    isSaved: isQuestionSaved(q),
                    isFlaggedForReview: !!currentQuiz.flaggedForReview[idx]
                });
            });

            const scorePercentage = Math.round((totalAchievedWeight / totalMaxWeight) * 100);

            // Save Test Log
            const startTimeStr = currentQuiz.timeStarted.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
            const endTimeStr = timeEnded.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
            const dateStr = timeEnded.toLocaleDateString('ar-SA');

            const newHistoryItem = {
                id: 'hist_' + Date.now(),
                quizTitle: currentQuiz.title,
                scorePercentage: scorePercentage,
                totalAchievedWeight: totalAchievedWeight,
                totalQuestions: totalMaxWeight,
                durationSeconds: totalDurationSec,
                dateStr: dateStr,
                timeRange: `من ${startTimeStr} إلى ${endTimeStr}`,
                questionLogs: questionLogs,
                questionsBackup: currentQuiz.questions
            };

            userStats.testHistory.unshift(newHistoryItem);
            userStats.totalTestsCount += 1;
            userStats.totalScores += scorePercentage;
            userStats.totalTimeSeconds += totalDurationSec;
            
            // Recalculate unique tested categories
            const testedCatSet = new Set(userStats.testHistory.map(h => h.quizTitle));
            userStats.testedCategories = testedCatSet.size;

            saveUserData();

            renderPostQuizResultsView(newHistoryItem, wrongQuestionsInThisTest);
        }

                                <span class="text-slate-400 block text-xs">النتيجة المحققة</span>

                            </div>
                            <div class="border-r border-slate-200 pr-6">

                            <button onclick="renderUserCategoriesView()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-6 py-3 rounded-xl transition-colors">
                                قائمة الأقسام
                            </button>
                        </div>
                    </div>

                    ${wrongQuestionsHtml}
                </div>
            `;
        }

        function renderWrongQuestionsView() {
            const main = document.getElementById('main-content');
            
            let listHtml = userStats.wrongQuestions.map((q, idx) => `
                <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">

        function renderSavedQuestionsView() {

            let listHtml = userStats.savedQuestions.map((q) => `
                <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">

            main.innerHTML = `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">

                            <h2 class="text-2xl font-black text-slate-800">الأسئلة المحفوظة</h2>

                        <input type="text" id="mq-opt-text-${i}" placeholder="الخيار ${i + 1}" class="w-full px-3 py-1.5 bg-white border rounded-xl text-sm" />
                        <select id="mq-opt-rank-${i}" class="px-2 py-1.5 bg-white border rounded-xl text-xs font-bold text-slate-700 w-36" title="درجة صحة الخيار">
                            <option value="1">1 - الأصح (100%)</option>
                            <option value="0.5">2 - أقل صحة (50%)</option>
                            <option value="0">خاطئ (0%)</option>
                        </select>
                    </div>
                `;
            }
            html += `</div>`;
            return html;
        }

        function renderOptionsAnalogyFields() {
            let html = `<div class="space-y-2"><label class="block text-xs font-bold text-slate-600">خيارات التناظر اللفظي</label>`;
            for (let i = 0; i < 4; i++) {
                html += `
                    <div class="flex items-center gap-2">
                        <input type="text" id="mq-opt-w1-${i}" placeholder="المفردة 1 الخيار ${i+1}" class="w-1/2 px-3 py-1.5 bg-white border rounded-xl text-sm" />
                        <span class="font-bold">:</span>
                        <input type="text" id="mq-opt-w2-${i}" placeholder="المفردة 2 الخيار ${i+1}" class="w-1/2 px-3 py-1.5 bg-white border rounded-xl text-sm" />
                        <select id="mq-opt-rank-${i}" class="px-2 py-1.5 bg-white border rounded-xl text-xs font-bold text-slate-700 w-32">
                            <option value="1">1 - الأصح</option>
                            <option value="0">خاطئ</option>
                        </select>
                    </div>
                `;
            }
            html += `</div>`;
            return html;
        }

        function addManualQuestionItem() {
            const type = document.getElementById('manual-q-type').value;
            let qObj = {
                id: 'q_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                type: type,
                options: []
            };

            if (type === 'الخطأ السياقي') {
                qObj.prompt = 'استخرج الخطأ السياقي';
                qObj.sentence = document.getElementById('mq-sentence')?.value || '';
            } else if (type === 'التناظر اللفظي') {
                qObj.prompt = 'استخرج التناظر';
                qObj.word1 = document.getElementById('mq-word1')?.value || '';
                qObj.word2 = document.getElementById('mq-word2')?.value || '';
            } else if (type === 'فهم المقروء') {
                qObj.prompt = 'استخرج المطلوب من النص:';
                qObj.passage = document.getElementById('mq-passage')?.value || '';
                qObj.question = document.getElementById('mq-question')?.value || '';
            } else if (type === 'المفردة الشاذة') {
                qObj.prompt = 'استخرج المفردة الشاذة';
            } else if (type === 'إكمال الجمل') {
                qObj.prompt = 'اكمل الجملة الآتية:';
                qObj.sentence = document.getElementById('mq-sentence')?.value || '';
            }

            // Options parsing
            for (let i = 0; i < 4; i++) {
                const rankVal = parseFloat(document.getElementById(`mq-opt-rank-${i}`)?.value || 0);
                if (type === 'التناظر اللفظي') {
                    const w1 = document.getElementById(`mq-opt-w1-${i}`)?.value || '';
                    const w2 = document.getElementById(`mq-opt-w2-${i}`)?.value || '';
                    if (w1 || w2) {
                        qObj.options.push({ text: `${w1} : ${w2}`, word1: w1, word2: w2, weight: rankVal });
                    }
                } else {
                    const txt = document.getElementById(`mq-opt-text-${i}`)?.value || '';
                    if (txt) {
                        qObj.options.push({ text: txt, weight: rankVal });
                    }
                }
            }

            if (!qObj.options.length) {
                showToast('يرجى تعبئة الخيارات بشكل صحيح', 'error');
                return;
            }

            manualAddState.questions.push(qObj);
            showToast('تمت إضافة السؤال بنجاح', 'success');
            renderAdminManualAddCategory();
        }

        function removeManualQuestion(idx) {
            manualAddState.questions.splice(idx, 1);
            renderAdminManualAddCategory();
        }

        function saveManualCategory() {
            const titleInput = document.getElementById('manual-cat-title')?.value || manualAddState.title;
            if (!titleInput.trim()) {
                showToast('يرجى كتابة اسم القسم أولاً', 'error');
                return;
            }
            if (manualAddState.questions.length === 0) {
                showToast('يرجى إضافة سؤال واحد على الأقل للقسم', 'error');
                return;
            }

            const newCategory = {
                id: 'cat_' + Date.now(),
                title: titleInput.trim(),
                questions: manualAddState.questions
            };

            appCategories.push(newCategory);
            saveCategoriesToStorage();

            manualAddState = { title: '', questions: [] };
            showToast('تم حفظ القسم الجديد بنجاح!', 'success');
            renderAdminManageCategories();
        }

        function renderAdminQuickAddCategory() {
            const main = document.getElementById('main-content');
            
            const formatTemplateSample = `القسم: اسم القسم هنا
---
نوع السؤال: التناظر اللفظي
السؤال: رئة : تنفس
الخيارات:
- عين : رؤية (أصح)
- أذن : سماعة
- قدم : حذاء
- يد : القلم
---
نوع السؤال: المفردة الشاذة
الخيارات:
- تفاح
- موز
- خيار (أصح)
- برتقال`;

            main.innerHTML = `
                <div class="max-w-3xl mx-auto space-y-6">
                    <button onclick="renderAdminAddCategoryOptions()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2 rounded-xl text-sm transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-arrow-right"></i>
                        <span>العودة والقواِعد</span>
                    </button>

                    <div class="bg-white rounded-3xl p-6 md:p-8 border border-slate-100 shadow-xl space-y-6">
                        <div class="flex justify-between items-center border-b pb-3">
                            <h3 class="text-2xl font-black text-slate-800">الإضافة السريعة بالذكاء الاصطناعي (AI)</h3>
                            <span class="bg-teal-50 text-teal-700 font-bold text-xs px-3 py-1 rounded-full">Gemini AI Powered</span>
                        </div>

                        <!-- Instruction Box -->
                        <div class="bg-slate-50 p-4 rounded-2xl border text-xs text-slate-600 leading-relaxed space-y-2">
                            <div class="font-bold text-slate-800 text-sm">طريقة الإدخال والمعايير:</div>
                            <p>يمكنك إما لصق النص بالصيغة التلقائية أدناه، أو كتابة/لصق أي نص اختبار مع نصوص عامة وسيتولى الـ AI تحليله وتوليد القسم بنقرة واحدة!</p>
                            
                            <div class="bg-white p-3 rounded-xl border border-slate-200 font-mono text-slate-700 relative">
                                <pre id="sample-quick-template" class="whitespace-pre-wrap">${formatTemplateSample}</pre>
                                <button onclick="copyQuickTemplate()" class="absolute top-2 left-2 text-xs bg-slate-100 hover:bg-slate-200 px-2 py-1 rounded text-slate-600 font-sans font-bold">
                                    <i class="fa-solid fa-copy"></i> نسخ النموذج
                                </button>
                            </div>
                        </div>

                        <!-- Text Area Input -->
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">أدخل النص أو الاختبار هنا:</label>
                            <textarea id="quick-add-input" rows="8" placeholder="الصق النص هنا أو اكتب أسئلة القسم..." class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500"></textarea>
                        </div>

                        <div class="flex flex-col sm:flex-row gap-3 pt-2">
                            <button onclick="processQuickAddAI()" id="btn-ai-quick" class="w-full bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-700 hover:to-emerald-700 text-white font-extrabold py-3.5 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                                <i class="fa-solid fa-wand-magic-sparkles"></i>
                                <span>معالجة النص وتوليد القسم ذكياً</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function copyQuickTemplate() {
            const txt = document.getElementById('sample-quick-template').innerText;
            navigator.clipboard.writeText(txt);
            showToast('تم نسخ نموذج الإضافة السريعة', 'info');
        }

        async function processQuickAddAI() {
            const rawText = document.getElementById('quick-add-input').value.trim();
            if (!rawText) {
                showToast('يرجى إدخال نص أولاً المعالجة', 'error');
                return;
            }

            const btn = document.getElementById('btn-ai-quick');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>جاري التحليل والإنشاء عبر الذكاء الاصطناعي...</span>`;

            try {
                // Call Gemini API via fetch
                const systemPrompt = `أنت مساعد خبير في تحليل وتقسيم أسئلة اختبارات القدرات باللغة العربية. قم بتحويل النص المرسل إلى صيغة JSON صريحة وقابلة للتحليل مباشرة تحتوي على اسم القسم وأسئلته بالأصناف (الخطأ السياقي، التناظر اللفظي، فهم المقروء، المفردة الشاذة، إكمال الجمل).
يجب أن ترجع فقط JSON بهذا الشكل الدقيق دون أي نصوص إضافية:
{
  "title": "اسم القسم",
  "questions": [
    {
      "type": "نوع السؤال من الخمسة الأقسام المحددة",
      "prompt": "عبارة التوجيه القصير",
      "word1": "في حال التناظر",
      "word2": "في حال التناظر",
      "passage": "في حال فهم المقروء",
      "sentence": "في حال إكمال الجمل أو الخطأ السياقي",
      "question": "في حال فهم المقروء",
      "options": [
        {"text": "الخيار 1", "weight": 1},
        {"text": "الخيار 2", "weight": 0}
      ]
    }
  ]
}`;

                const apiKey = ""; // Canvas runtime environment automatically supplies empty string key
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                const payload = {
                    contents: [{ parts: [{ text: rawText }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: { responseMimeType: "application/json" }
                };

                const res = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                const jsonText = data?.candidates?.[0]?.content?.parts?.[0]?.text;

                if (jsonText) {
                    const parsedData = JSON.parse(jsonText);
                    
                    if (parsedData && parsedData.questions && parsedData.questions.length > 0) {
                        const newCat = {
                            id: 'cat_' + Date.now(),
                            title: parsedData.title || 'قسم جديد مضاف سريعا',
                            questions: parsedData.questions.map((q, idx) => ({
                                id: 'q_ai_' + Date.now() + '_' + idx,
                                type: q.type || 'المفردة الشاذة',
                                prompt: q.prompt || 'إجب الإجابة الصحيحة',
                                word1: q.word1,
                                word2: q.word2,
                                passage: q.passage,
                                sentence: q.sentence,
                                question: q.question,
                                options: q.options || [{ text: 'خيار 1', weight: 1 }, { text: 'خيار 2', weight: 0 }]
                            }))
                        };

                        appCategories.push(newCat);
                        saveCategoriesToStorage();
                        showToast(`تم إضافة القسم "${newCat.title}" بنجاح بإجمالي ${newCat.questions.length} سؤال!`, 'success');
                        renderAdminManageCategories();
                        return;
                    }
                }

                throw new Error("Invalid response");
            } catch (err) {
                console.error(err);
                showToast('حدث خطأ في معالجة الذكاء الاصطناعي، يرجى التأكد من التنسيق وإعادة المحاولة', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> <span>معالجة النص وتوليد القسم ذكياً</span>`;
            }
        }

        function openPassageModal(passageText) {
            document.getElementById('passage-modal-content').innerText = passageText;
            document.getElementById('passage-modal').classList.remove('hidden');
        }

        function closePassageModal() {
            document.getElementById('passage-modal').classList.add('hidden');
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-slate-800 text-white';
            if (type === 'success') bgClass = 'bg-emerald-600 text-white';
            if (type === 'error') bgClass = 'bg-rose-600 text-white';
            if (type === 'warning') bgClass = 'bg-amber-500 text-white';

            toast.className = `${bgClass} px-4 py-3 rounded-2xl shadow-xl font-bold text-sm flex items-center gap-2 animate-bounce transition-all z-50`;
            toast.innerHTML = `<span>${escapeHtml(message)}</span>`;

            container.appendChild(toast);
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function escapeJsString(str) {
            if (!str) return '';
            return str.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\${/g, '\\${');
        }

        // Initialize application on window load
        window.onload = function() {
            initApp();
        };
    </script>
